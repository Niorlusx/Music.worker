name: Deploy Music Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install
        working-directory: minimax/music-2-6

      - name: Deploy Minimax Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: minimax/music-2-6
          secrets: |
            MINIMAX_API_KEY
            GROK_API_KEY
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
            SUPABASE_URL
            SUPABASE_ANON_KEY
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install dependencies (my-music-worker)
        run: npm install
        working-directory: my-music-worker

      - name: Deploy My Music Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: my-music-worker
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
